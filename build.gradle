buildscript {
    repositories {
        maven {
            url = projectRepositoriesMavenUrl
        }
    }
}

plugins {
    id 'jacoco'
    id 'java'
    id 'java-library'
    id 'maven-publish'
    id 'signing'
    alias(libs.plugins.gradle.versions.plugin)
    alias(libs.plugins.lombok.plugin)
    alias(libs.plugins.nmcp.gradle.plugin)
    alias(libs.plugins.pitest.gradle.plugin)
    alias(libs.plugins.spotless.plugin.gradle)
    alias(libs.plugins.version.catalog.update)
}

group = "$groupPackage" as Object
version = "$projectVersion" as Object
description = "$rootProject.name"

// import gradle files
apply from: "gradle/apply-gradle-files.gradle"

// Mutation-score floor the CI build fails below: .github/workflows/gradle.yml
// runs `./gradlew pitest` after the build. Measured 100 % (18 of 18 mutants killed)
// on 2026-11-02, once GreenMail tests replaced SendMailTLSTest, which needed a real
// Gmail account (#11). 94 lets one mutant survive at this size, as PIT rounds the
// score half up to a whole percent before it compares (17 of 18 is 94). Kept here,
// not in gradle/mutation-testing.gradle, so that the floor sits in the file a
// reader looks at.
pitest {
    mutationThreshold = 94
}

java {
    sourceCompatibility = "$projectSourceCompatibility" as Object
    toolchain {
        languageVersion = JavaLanguageVersion.of("$projectSourceCompatibility")
    }
}

tasks.withType(JavaCompile).configureEach { javaCompiler ->
    options.encoding = "UTF-8"
    options.compilerArgs << "-Xlint:deprecation"
    options.compilerArgs << "-Xlint:unchecked"
}

tasks.named("test") {
    it.mustRunAfter(tasks.named("jar"))
}
